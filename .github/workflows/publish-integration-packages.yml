name: Publish Integration Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag. Defaults to integration-packages-<run-number>.
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'integration-packages-*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Package integrations
        run: npm run package:all -- dist/integrations

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="integration-packages-${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "PACKAGE_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Generate catalog
        env:
          INTEGRATION_PACKAGE_BASE_URL: ${{ env.PACKAGE_BASE_URL }}
          INTEGRATION_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases
        run: |
          npm run catalog -- dist/integrations dist/integrations/catalog.json
          npm run catalog -- dist/integrations catalog/integrations.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-packages
          path: |
            dist/integrations/*.tgz
            dist/integrations/*.sha256
            dist/integrations/*.manifest.json
            dist/integrations/catalog.json
            catalog/integrations.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes "Action1 Marketplace integration packages" \
            dist/integrations/*.tgz \
            dist/integrations/*.sha256 \
            dist/integrations/*.manifest.json \
            dist/integrations/catalog.json

      - name: Commit stable catalog
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/integrations.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
          else
            git commit -m "Update integration package catalog [skip ci]"
            git push
          fi
