services:
  postgres:
    image: postgres:16
    container_name: action1-marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5433:5432"
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  marketplace:
    image: timaction1/action1-marketplace:latest
    container_name: action1-marketplace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3001"
    environment:
      INTEGRATIONS_DIR: /app/integrations
      DATABASE_PROVIDER: local_postgres
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      DATABASE_SSL: "false"
      DATA_DIR: /app/backend/data
      MARKETPLACE_SEED_TEST_DATA: "true"
    volumes:
      - ./integrations:/app/integrations:ro

volumes:
  marketplace_postgres_data: